    <title>SkyEmu</title>
    <style>
      body{padding:0; margin:0;}
      .emscripten { padding: 0; margin: 0; display: block; }
      textarea.emscripten { font-family: monospace; width: 80%; }
      div.emscripten { text-align: center; }
      div.emscripten_border { border: 1px solid black; }
      /* the canvas *must not* have any border or padding, or mouse coords will be wrong */
      canvas.emscripten {
        background-color: black;
        width: 100%;
        height: 100%;
      }
      #canvas {
          position: absolute;
          top: 0px;
          left: 0px;
          margin: 0px;
          width: 100%;
          height: 100%;
          overflow: hidden;
          display: block;
      }
      #recording-controls {
        position: fixed;
        right: 16px;
        bottom: 16px;
        z-index: 110;
        display: flex;
        flex-direction: column;
        gap: 8px;
        align-items: flex-end;
        font-family: sans-serif;
      }
      .recording-button {
        min-width: 150px;
        border-radius: 999px;
        border: 2px solid transparent;
        font-size: 14px;
        font-weight: 700;
        padding: 10px 14px;
        cursor: pointer;
      }
      .recording-button:disabled {
        opacity: 0.55;
        cursor: not-allowed;
      }
      #start-recording {
        background: #d41212;
        color: #ffffff;
      }
      #stop-recording {
        background: #000000;
        color: #ff5252;
        border-color: #c30000;
      }
      #recording-status {
        color: #ffffff;
        background: rgba(0, 0, 0, 0.65);
        padding: 4px 8px;
        border-radius: 4px;
        font-size: 12px;
        max-width: 220px;
      }
      input[type="file"] {
        display: block !important;
        opacity: 0% !important;
        overflow: hidden !important;
        z-index: 100 !important;
        margin-top: 0px;
        padding-top: 0px;
        position: absolute;
        visibility:hidden;
      }
      .spinner {
        height: 50px;
        width: 50px;
        margin: 0px auto;
        -webkit-animation: rotation .8s linear infinite;
        -moz-animation: rotation .8s linear infinite;
        -o-animation: rotation .8s linear infinite;
        animation: rotation 0.8s linear infinite;
        border-left: 10px solid rgb(0,150,240);
        border-right: 10px solid rgb(0,150,240);
        border-bottom: 10px solid rgb(0,150,240);
        border-top: 10px solid rgb(100,0,200);
        border-radius: 100%;
        background-color: rgb(200,100,250);
      }
      @-webkit-keyframes rotation {
        from {-webkit-transform: rotate(0deg);}
        to {-webkit-transform: rotate(360deg);}
      }
      @-moz-keyframes rotation {
        from {-moz-transform: rotate(0deg);}
        to {-moz-transform: rotate(360deg);}
      }
      @-o-keyframes rotation {
        from {-o-transform: rotate(0deg);}
        to {-o-transform: rotate(360deg);}
      }
      @keyframes rotation {
        from {transform: rotate(0deg);}
        to {transform: rotate(360deg);}
      }

    </style>

  <body>
    <figure style="overflow:visible;" id="spinner"><div class="spinner"></div><center style="margin-top:0.5em"><strong>emscripten</strong></center></figure>
    <div class="emscripten" id="status">Downloading...</div>
    <div class="emscripten">
      <progress value="0" max="100" id="progress" hidden=1></progress>  
    </div>
    <div class="emscripten_border" id="container">
      <canvas class="emscripten" id="canvas" oncontextmenu="event.preventDefault()" tabindex=-1></canvas>
    </div>
    <div id="recording-controls">
      <button class="recording-button" id="start-recording" type="button">Start Recording</button>
      <button class="recording-button" id="stop-recording" type="button">Stop Recording</button>
      <div id="recording-status">Recorder idle</div>
    </div>
    <!-- Code for displaying console 
    <hr/>
    <textarea class="emscripten" id="output" rows="8"></textarea>
    <hr>
    -->       
    <script src="webm-muxer.js"></script>
    <script type='text/javascript'>    
      if ('serviceWorker' in navigator) {
          navigator.serviceWorker.register('sw.js').then(worker => {
          }).catch(e => console.log('Failed to register service worker', e));
      }                      
      window.scroll(0,1);
      var statusElement = document.getElementById('status');
      var progressElement = document.getElementById('progress');
      var spinnerElement = document.getElementById('spinner');
      var startRecordingButton = document.getElementById('start-recording');
      var stopRecordingButton = document.getElementById('stop-recording');
      var recordingStatusElement = document.getElementById('recording-status');
      
      function setRecordingStatus(text) {
        recordingStatusElement.textContent = text;
      }

      function setRecordingButtonsState(isRecording, runtimeReady) {
        startRecordingButton.disabled = !runtimeReady || isRecording;
        stopRecordingButton.disabled = !runtimeReady || !isRecording;
      }

      var recorderRuntimeReady = false;
      var isRecorderRunning = false;
      var recordingSessionCounter = 0;

      function triggerDownload(blob, filename) {
        const a = document.createElement('a');
        const url = window.URL.createObjectURL(blob);
        a.href = url;
        a.download = filename;
        a.style.display = 'none';
        document.body.appendChild(a);
        a.click();
        window.URL.revokeObjectURL(url);
        document.body.removeChild(a);
      }

      function getUploadEndpointUrl() {
        const baseUrl = new URL('.', window.location.href);
        return new URL('upload-recording', baseUrl).toString();
      }

      function sanitizeRecordingName(name) {
        const fallback = 'gameboy';
        const trimmed = (name || '').trim();
        if (!trimmed) return fallback;
        const sanitized = trimmed.replace(/[^a-zA-Z0-9._-]+/g, '_').replace(/^_+|_+$/g, '');
        return sanitized || fallback;
      }

      function createSessionUuid() {
        if (window.crypto && typeof window.crypto.randomUUID === 'function') {
          return window.crypto.randomUUID();
        }
        recordingSessionCounter += 1;
        return 'session-' + Date.now().toString(16) + '-' + recordingSessionCounter.toString(16);
      }

      function actionStateFromMask(actionMask) {
        return {
          a: actionMask & (1 << 0) ? 1 : 0,
          b: actionMask & (1 << 1) ? 1 : 0,
          up: actionMask & (1 << 2) ? 1 : 0,
          down: actionMask & (1 << 3) ? 1 : 0,
          left: actionMask & (1 << 4) ? 1 : 0,
          right: actionMask & (1 << 5) ? 1 : 0,
          start: actionMask & (1 << 6) ? 1 : 0,
          select: actionMask & (1 << 7) ? 1 : 0
        };
      }

      window.skyemuRecorder = {
        recording: false,
        rotating: false,
        stopRequested: false,
        width: 0,
        height: 0,
        encoder: null,
        encoderConfigTemplate: null,
        muxerCodec: '',
        currentSegment: null,
        encoderProbePromise: null,
        actions: [],
        pendingFrames: [],
        pendingActions: [],
        sessionUuid: '',
        romBaseName: 'gameboy',
        sessionStartMs: 0,
        fps: 60,
        partNumber: 0,
        nextPartNumber: 0,
        nextPartStartFrame: 0,
        partStartFrame: 0,
        segmentSubmittedFrameCount: 0,
        keyFrameInterval: 300,
        setRuntimeReady: function(ready) {
          if (!ready) {
            recorderRuntimeReady = false;
            setRecordingButtonsState(this.recording, false);
            setRecordingStatus('Recorder loading...');
            return;
          }
          if (this.encoderProbePromise) return;

          recorderRuntimeReady = false;
          setRecordingButtonsState(this.recording, false);
          setRecordingStatus('Checking recorder support...');
          this.encoderProbePromise = this.probeEncoderSupport().then((result) => {
            this.encoderConfigTemplate = result.config;
            this.muxerCodec = result.muxerCodec;
            recorderRuntimeReady = true;
            setRecordingButtonsState(this.recording, true);
            if (!this.recording) {
              setRecordingStatus('Recorder idle');
            }
          }).catch((error) => {
            console.error('Recorder capability probe failed.', error);
            this.encoderConfigTemplate = null;
            this.muxerCodec = '';
            recorderRuntimeReady = false;
            setRecordingButtonsState(this.recording, false);
            setRecordingStatus(error && error.message ? error.message : 'Recorder unavailable in this browser.');
          });
        },
        getProbeCandidates: function(width, height, fps) {
          return [
            {
              config: {
                codec: 'vp8',
                width: width,
                height: height,
                bitrate: 1250000,
                bitrateMode: 'constant',
                framerate: fps,
                latencyMode: 'realtime'
              },
              muxerCodec: 'V_VP8'
            },
            {
              config: {
                codec: 'vp09.00.10.08',
                width: width,
                height: height,
                bitrate: 1500000,
                bitrateMode: 'constant',
                framerate: fps,
                latencyMode: 'realtime'
              },
              muxerCodec: 'V_VP9'
            }
          ];
        },
        probeEncoderSupport: async function() {
          if (typeof WebMMuxer === 'undefined') {
            throw new Error('Recorder muxer failed to load.');
          }
          if (typeof VideoEncoder === 'undefined' || typeof VideoFrame === 'undefined') {
            throw new Error('WebCodecs video recording is not supported in this browser.');
          }

          const candidates = this.getProbeCandidates(160, 144, 60);
          for (let i = 0; i < candidates.length; i += 1) {
            const candidate = candidates[i];
            try {
              if (typeof VideoEncoder.isConfigSupported === 'function') {
                const support = await VideoEncoder.isConfigSupported(candidate.config);
                if (support && support.supported) {
                  return candidate;
                }
                continue;
              }

              const probeEncoder = new VideoEncoder({
                output: function() {},
                error: function() {}
              });
              probeEncoder.configure(candidate.config);
              probeEncoder.close();
              return candidate;
            } catch (error) {
              continue;
            }
          }

          throw new Error('No supported WebCodecs WebM video codec was found.');
        },
        forceDisableCoreRecorder: function() {
          if (!Module) return;
          try {
            if (Module._se_set_gb_lcd_recording) {
              Module._se_set_gb_lcd_recording(0);
            } else if (Module.ccall) {
              Module.ccall('se_set_gb_lcd_recording', 'number', ['number'], [0]);
            }
          } catch (error) {
            console.error('Failed to disable recorder bridge after a fatal recorder error.', error);
          }
        },
        abortRecordingWithError: function(message, error) {
          console.error(message, error);
          this.finalizeSessionCleanup(message);
          this.forceDisableCoreRecorder();
        },
        getPartBaseName: function(partNumber) {
          return this.romBaseName + '.' + this.sessionUuid + '.' + String(partNumber).padStart(4, '0');
        },
        appendSegmentMeta: function(segment) {
          segment.actions.push(JSON.stringify({
            type: 'meta',
            rom: this.romBaseName,
            session_uuid: this.sessionUuid,
            part_number: segment.partNumber,
            start_frame: segment.startFrame,
            fps: this.fps
          }));
        },
        prepareSegmentBuffers: function(partNumber, startFrame) {
          const segment = {
            partNumber: partNumber,
            startFrame: startFrame,
            actions: [],
            segmentSubmittedFrameCount: 0,
            firstEncodedChunkTimestamp: null,
            muxer: null,
            muxerTarget: null,
            encoder: null,
            outputState: null
          };
          this.currentSegment = segment;
          this.partNumber = partNumber;
          this.partStartFrame = startFrame;
          this.segmentSubmittedFrameCount = 0;
          this.actions = segment.actions;
          this.appendSegmentMeta(segment);
        },
        buildEncoderConfig: function() {
          if (!this.encoderConfigTemplate) {
            throw new Error('Recorder codec support was not initialized.');
          }
          return {
            codec: this.encoderConfigTemplate.codec,
            width: this.width,
            height: this.height,
            bitrate: this.encoderConfigTemplate.bitrate,
            bitrateMode: this.encoderConfigTemplate.bitrateMode,
            framerate: this.fps,
            latencyMode: this.encoderConfigTemplate.latencyMode
          };
        },
        createMuxerForCurrentPart: function() {
          const segment = this.currentSegment;
          if (!segment) {
            throw new Error('Recorder segment state was not initialized.');
          }
          segment.muxerTarget = new WebMMuxer.ArrayBufferTarget();
          segment.muxer = new WebMMuxer.Muxer({
            target: segment.muxerTarget,
            firstTimestampBehavior: 'offset',
            video: {
              codec: this.muxerCodec,
              width: this.width,
              height: this.height,
              frameRate: this.fps
            }
          });
        },
        startEncoderForCurrentPart: function() {
          this.createMuxerForCurrentPart();
          const segment = this.currentSegment;
          if (!segment || !segment.muxer) {
            throw new Error('Recorder segment muxer was not created.');
          }
          const localMuxer = segment.muxer;
          const outputState = { acceptingOutput: true };
          segment.outputState = outputState;
          segment.encoder = new VideoEncoder({
            output: (chunk, meta) => {
              if (!outputState.acceptingOutput) return;
              if (segment.firstEncodedChunkTimestamp === null) {
                segment.firstEncodedChunkTimestamp = chunk.timestamp;
              }
              localMuxer.addVideoChunk(chunk, meta, chunk.timestamp - segment.firstEncodedChunkTimestamp);
            },
            error: (error) => {
              if (!outputState.acceptingOutput) return;
              setTimeout(() => {
                this.abortRecordingWithError('Recording failed while encoding video.', error);
              }, 0);
            }
          });
          segment.encoder.configure(this.buildEncoderConfig());
          this.encoder = segment.encoder;
        },
        start: function(width, height, fps, romName) {
          if (this.recording) return true;
          if (!this.encoderConfigTemplate || !this.muxerCodec) {
            setRecordingStatus('Recorder support check has not completed or failed.');
            return false;
          }

          this.width = width;
          this.height = height;
          this.fps = fps || 60;
          this.keyFrameInterval = Math.max(1, Math.round(this.fps * 5));
          this.pendingFrames = [];
          this.pendingActions = [];
          this.sessionUuid = createSessionUuid();
          this.romBaseName = sanitizeRecordingName(romName);
          this.sessionStartMs = performance.now();
          this.rotating = false;
          this.stopRequested = false;
          this.nextPartNumber = 1;
          this.nextPartStartFrame = 0;
          this.prepareSegmentBuffers(0, 0);

          try {
            this.startEncoderForCurrentPart();
          } catch (error) {
            console.error('Failed to initialize the WebCodecs recorder.', error);
            this.finalizeSessionCleanup(error && error.message ? error.message : 'Failed to initialize recorder.');
            return false;
          }

          this.recording = true;
          isRecorderRunning = true;
          setRecordingButtonsState(true, recorderRuntimeReady);
          setRecordingStatus('Recording Game Boy LCD part 0000...');
          return true;
        },
        getRelativeFrameIndex: function(frameIndex, segment) {
          return frameIndex - segment.startFrame;
        },
        getFrameTimestampUs: function(relativeFrameIndex) {
          return Math.round(relativeFrameIndex * 1000000 / this.fps);
        },
        getFrameDurationUs: function(relativeFrameIndex) {
          return Math.round((relativeFrameIndex + 1) * 1000000 / this.fps) - Math.round(relativeFrameIndex * 1000000 / this.fps);
        },
        submitFrameToEncoder: function(frameData, frameIndex) {
          const segment = this.currentSegment;
          if (!segment || !segment.encoder || !segment.muxer) return;

          const relativeFrameIndex = this.getRelativeFrameIndex(frameIndex, segment);
          if (relativeFrameIndex < 0) {
            throw new Error('Recorder received a frame that predates the current segment start.');
          }

          const frame = new VideoFrame(frameData, {
            format: 'RGBA',
            codedWidth: this.width,
            codedHeight: this.height,
            timestamp: this.getFrameTimestampUs(relativeFrameIndex),
            duration: this.getFrameDurationUs(relativeFrameIndex)
          });

          try {
            segment.encoder.encode(frame, {
              keyFrame: relativeFrameIndex === 0 || (relativeFrameIndex % this.keyFrameInterval) === 0
            });
            segment.segmentSubmittedFrameCount += 1;
            this.segmentSubmittedFrameCount = segment.segmentSubmittedFrameCount;
          } finally {
            frame.close();
          }
        },
        pushFrame: function(rgbaPtr, byteLen, frameIndex) {
          if (!this.recording || !this.currentSegment || !this.currentSegment.encoder) return;

          const frameData = HEAPU8.slice(rgbaPtr, rgbaPtr + byteLen);
          if (this.rotating) {
            this.pendingFrames.push({ frameIndex: frameIndex, frameData: frameData });
            return;
          }

          try {
            this.submitFrameToEncoder(frameData, frameIndex);
          } catch (error) {
            this.abortRecordingWithError('Recording failed while submitting a frame.', error);
          }
        },
        logActionState: function(frameIndex, actionMask) {
          if (!this.recording || !this.currentSegment) return;
          const line = JSON.stringify({
            type: 'action_state',
            frame_index: frameIndex,
            action_state: actionStateFromMask(actionMask),
            ts_ms: Math.round(performance.now() - this.sessionStartMs)
          });
          if (this.rotating) {
            this.pendingActions.push(line);
            return;
          }
          this.currentSegment.actions.push(line);
        },
        buildCurrentPartData: function(segment, videoBuffer) {
          const partBaseName = this.getPartBaseName(segment.partNumber);
          const videoBlob = new Blob([videoBuffer], { type: 'video/webm' });
          const jsonlText = segment.actions.length ? (segment.actions.join('\n') + '\n') : '';
          const jsonlBlob = new Blob([jsonlText], { type: 'application/x-ndjson' });
          return {
            videoBlob: videoBlob,
            jsonlBlob: jsonlBlob,
            videoFilename: partBaseName + '.webm',
            actionsFilename: partBaseName + '.actions.jsonl'
          };
        },
        uploadCurrentPart: async function(segment, partData) {
          const formData = new FormData();
          formData.append('rom', this.romBaseName);
          formData.append('session_uuid', this.sessionUuid);
          formData.append('part_number', String(segment.partNumber));
          formData.append('start_frame', String(segment.startFrame));
          formData.append('fps', String(this.fps));
          formData.append('video', partData.videoBlob, partData.videoFilename);
          formData.append('actions', partData.jsonlBlob, partData.actionsFilename);

          const response = await fetch(getUploadEndpointUrl(), {
            method: 'POST',
            credentials: 'same-origin',
            body: formData
          });

          if (!response.ok) {
            let bodyText = '';
            try {
              bodyText = await response.text();
            } catch (error) {
              bodyText = '';
            }
            throw new Error('Upload failed with status ' + response.status + (bodyText ? (': ' + bodyText) : ''));
          }
        },
        downloadCurrentPart: function(partData) {
          triggerDownload(partData.videoBlob, partData.videoFilename);
          triggerDownload(partData.jsonlBlob, partData.actionsFilename);
        },
        persistCurrentPart: async function(segment, partData) {
          try {
            await this.uploadCurrentPart(segment, partData);
            return { uploaded: true, fallbackDownload: false };
          } catch (error) {
            console.error('Segment upload failed; falling back to local download.', error);
            this.downloadCurrentPart(partData);
            setRecordingStatus('Upload failed for part ' + String(segment.partNumber).padStart(4, '0') + '; downloaded locally as fallback.');
            return { uploaded: false, fallbackDownload: true };
          }
        },
        closeCurrentEncoder: function() {
          const segment = this.currentSegment;
          if (!segment) {
            this.encoder = null;
            return;
          }
          if (segment.outputState) {
            segment.outputState.acceptingOutput = false;
          }
          if (segment.encoder) {
            try {
              if (segment.encoder.state !== 'closed') {
                segment.encoder.close();
              }
            } catch (error) {
              console.error('Failed to close the active recorder encoder cleanly.', error);
            }
          }
          segment.encoder = null;
          segment.outputState = null;
          this.encoder = null;
        },
        finalizeCurrentPartData: async function() {
          const segment = this.currentSegment;
          if (!segment || !segment.encoder || !segment.muxer || !segment.muxerTarget) {
            throw new Error('Recorder state is incomplete for segment finalization.');
          }
          this.currentSegment = null;
          this.encoder = null;

          await segment.encoder.flush();
          segment.muxer.finalize();
          if (segment.outputState) {
            segment.outputState.acceptingOutput = false;
          }
          segment.encoder.close();
          segment.encoder = null;
          segment.muxer = null;
          segment.outputState = null;

          if (!segment.muxerTarget.buffer) {
            throw new Error('Recorder muxer did not produce a segment buffer.');
          }
          const partData = this.buildCurrentPartData(segment, segment.muxerTarget.buffer);
          segment.muxerTarget = null;
          return { segment: segment, partData: partData };
        },
        finalizeSessionCleanup: function(message) {
          this.recording = false;
          this.rotating = false;
          this.stopRequested = false;
          isRecorderRunning = false;
          this.closeCurrentEncoder();
          this.currentSegment = null;
          this.actions = [];
          this.pendingFrames = [];
          this.pendingActions = [];
          setRecordingButtonsState(false, recorderRuntimeReady);
          setRecordingStatus(message);
        },
        flushPendingToNewPart: function() {
          const segment = this.currentSegment;
          if (!segment) return;
          while (this.pendingActions.length) {
            segment.actions.push(this.pendingActions.shift());
          }
          while (this.pendingFrames.length) {
            const pendingFrame = this.pendingFrames.shift();
            this.submitFrameToEncoder(pendingFrame.frameData, pendingFrame.frameIndex);
          }
        },
        finishCurrentPart: async function() {
          const finalized = await this.finalizeCurrentPartData();
          return this.persistCurrentPart(finalized.segment, finalized.partData);
        },
        rotateSegment: function(partNumber, startFrame) {
          if (!this.recording || this.stopRequested || this.rotating) return;
          this.rotating = true;
          this.nextPartNumber = partNumber;
          this.nextPartStartFrame = startFrame;
          setRecordingStatus('Uploading segment ' + String(this.partNumber).padStart(4, '0') + '...');
          this.finishCurrentPart().then((result) => {
            if (this.stopRequested) {
              this.rotating = false;
              if (this.pendingFrames.length || this.pendingActions.length) {
                const finalPartNumber = this.nextPartNumber;
                const finalStartFrame = this.nextPartStartFrame;
                this.stopRequested = false;
                this.prepareSegmentBuffers(finalPartNumber, finalStartFrame);
                this.startEncoderForCurrentPart();
                this.flushPendingToNewPart();
                setTimeout(() => {
                  this.stopAndDownload();
                }, 0);
                return;
              }
              this.finalizeSessionCleanup(result && result.fallbackDownload ? 'Recording saved locally (upload fallback).' : 'Recording uploaded.');
              return;
            }

            this.prepareSegmentBuffers(this.nextPartNumber, this.nextPartStartFrame);
            this.startEncoderForCurrentPart();
            this.flushPendingToNewPart();
            this.rotating = false;
            setRecordingButtonsState(true, recorderRuntimeReady);
            setRecordingStatus('Recording Game Boy LCD part ' + String(this.partNumber).padStart(4, '0') + '...');
          }).catch((error) => {
            this.abortRecordingWithError('Recording failed while finalizing a segment.', error);
          });
        },
        stopAndDownload: function() {
          if (!this.recording) return;
          if (this.rotating) {
            this.stopRequested = true;
            setRecordingStatus('Finalizing recording...');
            return;
          }

          this.stopRequested = true;
          setRecordingStatus('Uploading recording...');
          this.finishCurrentPart().then((result) => {
            if (this.pendingFrames.length || this.pendingActions.length) {
              const finalPartNumber = this.nextPartNumber;
              const finalStartFrame = this.nextPartStartFrame;
              this.stopRequested = false;
              this.prepareSegmentBuffers(finalPartNumber, finalStartFrame);
              this.startEncoderForCurrentPart();
              this.flushPendingToNewPart();
              setTimeout(() => {
                this.stopAndDownload();
              }, 0);
              return;
            }
            this.finalizeSessionCleanup(result && result.fallbackDownload ? 'Recording saved locally (upload fallback).' : 'Recording uploaded.');
          }).catch((error) => {
            this.abortRecordingWithError('Recording failed while finalizing the session.', error);
          });
        }
      };

      function setRecordingEnabled(enabled) {
        if (!recorderRuntimeReady) {
          setRecordingStatus('Recorder not ready yet.');
          return;
        }
        if (!Module) {
          setRecordingStatus('Module not available.');
          return;
        }
        let result = 0;
        if (Module._se_set_gb_lcd_recording) {
          result = Module._se_set_gb_lcd_recording(enabled ? 1 : 0);
        } else if (Module.ccall) {
          result = Module.ccall('se_set_gb_lcd_recording', 'number', ['number'], [enabled ? 1 : 0]);
        } else {
          setRecordingStatus('Recording bridge unavailable.');
          return;
        }

        if (enabled && result === 0) {
          setRecordingStatus('Load a Game Boy ROM before recording.');
        } else if (!enabled && !isRecorderRunning) {
          setRecordingButtonsState(false, recorderRuntimeReady);
          setRecordingStatus('Recorder idle');
        }
      }

      startRecordingButton.addEventListener('click', function() {
        setRecordingEnabled(true);
      });
      stopRecordingButton.addEventListener('click', function() {
        setRecordingEnabled(false);
      });
      setRecordingButtonsState(false, false);
      setRecordingStatus('Recorder loading...');

      var Module = {
        preRun: [],
        postRun: [],
        print: (function() {
          var element = document.getElementById('output');
          if (element) element.value = ''; // clear browser cache
          return function(text) {
            if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
            // These replacements are necessary if you render to raw HTML
            //text = text.replace(/&/g, "&amp;");
            //text = text.replace(/</g, "&lt;");
            //text = text.replace(/>/g, "&gt;");
            //text = text.replace('\n', '<br>', 'g');
            console.log(text);
            if (element) {
              element.value += text + "\n";
              element.scrollTop = element.scrollHeight; // focus on bottom
            }
          };
        })(),
        printErr: function(text) {
          if (arguments.length > 1) text = Array.prototype.slice.call(arguments).join(' ');
          console.error(text);
        },
        canvas: (function() {
          var canvas = document.getElementById('canvas');

          // As a default initial behavior, pop up an alert when webgl context is lost. To make your
          // application robust, you may want to override this behavior before shipping!
          // See http://www.khronos.org/registry/webgl/specs/latest/1.0/#5.15.2
          //          canvas.addEventListener("webglcontextlost", function(e) { alert('WebGL context lost. You will need to reload the page.'); e.preventDefault(); }, false);
          // On WebGL context loss, silently reload the page.
          canvas.addEventListener("webglcontextlost", function(e) {
            e.preventDefault();
            // small delay to let the event complete before reloading
            setTimeout(function() { window.location.reload(); }, 50);
          }, false);

          return canvas;
        })(),
        setStatus: function(text) {
          if (!Module.setStatus.last) Module.setStatus.last = { time: Date.now(), text: '' };
          if (text === Module.setStatus.last.text) return;
          var m = text.match(/([^(]+)\((\d+(\.\d+)?)\/(\d+)\)/);
          var now = Date.now();
          if (m && now - Module.setStatus.last.time < 30) return; // if this is a progress update, skip it if too soon
          Module.setStatus.last.time = now;
          Module.setStatus.last.text = text;
          if (m) {
            text = m[1];
            progressElement.value = parseInt(m[2])*100;
            progressElement.max = parseInt(m[4])*100;
            progressElement.hidden = false;
            spinnerElement.hidden = false;
          } else {
            progressElement.value = null;
            progressElement.max = null;
            progressElement.hidden = true;
            if (!text) spinnerElement.hidden = true;
          }
          statusElement.innerHTML = text;
        },
        totalDependencies: 0,
        monitorRunDependencies: function(left) {
          this.totalDependencies = Math.max(this.totalDependencies, left);
          Module.setStatus(left ? 'Preparing... (' + (this.totalDependencies-left) + '/' + this.totalDependencies + ')' : 'All downloads complete.');
        }
      };
      Module.postRun.push(function() {
        if (window.skyemuRecorder && window.skyemuRecorder.setRuntimeReady) {
          window.skyemuRecorder.setRuntimeReady(true);
        }
      });

      var container = document.getElementById ("container");

      Module.setStatus('Downloading...');
      window.onerror = function() {
        Module.setStatus('Exception thrown, see JavaScript console');
        spinnerElement.style.display = 'none';
        Module.setStatus = function(text) {
          if (text) Module.printErr('[post-exception status] ' + text);
        };
      };
    </script>
